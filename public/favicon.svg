<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Outer Glow & Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45" />
    </filter>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066" />
      <stop offset="50%" stop-color="#FFD166" />
      <stop offset="100%" stop-color="#F48C06" />
    </linearGradient>
    <linearGradient id="centerHub" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#FFD166" />
      <stop offset="100%" stop-color="#E85D04" />
    </linearGradient>
  </defs>

  <!-- Outer Wheel Ring with Shadow -->
  <circle cx="32" cy="32" r="30" fill="#18132B" filter="url(#shadow)" stroke="url(#goldRim)" stroke-width="2.5" />

  <!-- 8 Slices of the Gift Wheel -->
  <g transform="translate(32, 32)">
    <!-- Slice 1 (0 to 45 deg) -->
    <path d="M 0 0 L 26 0 A 26 26 0 0 1 18.38 18.38 Z" fill="#FF6B6B" />
    <!-- Slice 2 (45 to 90 deg) -->
    <path d="M 0 0 L 18.38 18.38 A 26 26 0 0 1 0 26 Z" fill="#FFD166" />
    <!-- Slice 3 (90 to 135 deg) -->
    <path d="M 0 0 L 0 26 A 26 26 0 0 1 -18.38 18.38 Z" fill="#06D6A0" />
    <!-- Slice 4 (135 to 180 deg) -->
    <path d="M 0 0 L -18.38 18.38 A 26 26 0 0 1 -26 0 Z" fill="#4CC9F0" />
    <!-- Slice 5 (180 to 225 deg) -->
    <path d="M 0 0 L -26 0 A 26 26 0 0 1 -18.38 -18.38 Z" fill="#F72585" />
    <!-- Slice 6 (225 to 270 deg) -->
    <path d="M 0 0 L -18.38 -18.38 A 26 26 0 0 1 0 -26 Z" fill="#8338EC" />
    <!-- Slice 7 (270 to 315 deg) -->
    <path d="M 0 0 L 0 -26 A 26 26 0 0 1 18.38 -18.38 Z" fill="#FF9F1C" />
    <!-- Slice 8 (315 to 360 deg) -->
    <path d="M 0 0 L 18.38 -18.38 A 26 26 0 0 1 26 0 Z" fill="#7209B7" />

    <!-- Slice Dividing Lines -->
    <circle cx="0" cy="0" r="26" fill="none" stroke="#18132B" stroke-width="1" />
  </g>

  <!-- Golden Center Hub -->
  <circle cx="32" cy="32" r="11" fill="url(#centerHub)" stroke="#FFFFFF" stroke-width="1.5" filter="url(#shadow)" />

  <!-- Gift Ribbon / Star Emblem in Center -->
  <!-- Gift Box Base -->
  <rect x="27" y="28" width="10" height="8" rx="1.5" fill="#C1121F" />
  <rect x="26" y="26.5" width="12" height="3" rx="1" fill="#E63946" />
  <!-- Yellow Ribbon Cross -->
  <rect x="31" y="26.5" width="2" height="9.5" fill="#FFD166" />
  <rect x="27" y="31" width="10" height="2" fill="#FFD166" />
  <!-- Bow on top -->
  <circle cx="29.8" cy="25.5" r="1.3" fill="#FFD166" />
  <circle cx="34.2" cy="25.5" r="1.3" fill="#FFD166" />
  
  <!-- Pointer Arrow Indicator at the Top -->
  <polygon points="32,1 36,9 28,9" fill="#FFD166" stroke="#18132B" stroke-width="1" />
</svg>
